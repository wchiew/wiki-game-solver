[project]
name = "wikigraph"
version = "0.1.0"
description = "Offline pipeline: Wikimedia SQL dumps -> compact link graph artifacts"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pyarrow>=17",
    "duckdb>=1.1",
    "numpy>=2.0",
]

[project.scripts]
wikigraph = "wikigraph.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.7",
]

[tool.uv]
# Use the OS certificate store. Required behind a TLS-inspecting proxy, where
# uv's bundled roots reject the intercepted certificate as `UnknownIssuer`;
# harmless everywhere else.
system-certs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wikigraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: hits the real dumps.wikimedia.org; deselected by default",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
# `helpers` is the test-suite's own module, not a dependency.
known-first-party = ["wikigraph", "helpers"]
